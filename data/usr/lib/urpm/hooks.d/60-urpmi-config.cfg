# Keep urpmi's own media configuration on the installed release.
#
# See urpm/core/hooks.py for the mechanism and urpm/core/urpmi_config.py
# for what this action does.
#
# To change any of this, drop a file of the SAME NAME in
# /etc/urpm/hooks.d/ : it masks this one entirely, and it survives
# upgrades because nothing here is %config.

# urpmi and urpm-ng coexist on a Mageia system.  After a distupgrade,
# urpmi still names the release the machine just left: its URL-direct
# media carry the number in the path and nothing rewrites it.  An
# operator meets that the first time they type urpmi.
#
# Only a distupgrade needs this, hence `on`.  The capability watched is
# urpmi's own: a machine without urpmi never has it in a transaction,
# so the rule never fires there, and no condition has to be written for
# that.
#
# The action takes no argument on purpose.  It moves urpmi's media from
# the release the distupgrade left to the one it reached, reading the
# pair from the upgrade's own state, and it keeps the ignore markers,
# the key ids and the third-party entries an administrator chose.  A
# backup is written beside the file first.
#
# Only a mirrorlist written as the $MIRRORLIST symbol is left alone:
# urpmi resolves that one through /etc/product.id, which comes from
# mageia-release, so it follows the new release by itself.  A
# mirrorlist holding a literal versioned URL, which is what
# urpmi.addmedia --distrib leaves behind, does not, and is moved like
# any other.
#
# A URL in a shape none of the rules know is reported by name rather
# than silently skipped.
[on-completion:urpmi-config]
watch  = urpmi
action = sync-urpmi-config
on     = distupgrade
