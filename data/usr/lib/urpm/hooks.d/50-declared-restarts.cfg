# Post-operation rules shipped by urpm-ng.
#
# Read once an operation is committed and recorded, never during it.
# See urpm/core/hooks.py and doc/SPEC_POST_TRANSACTION_HOOKS.md.
#
# To change any of this, drop a file of the SAME NAME in
# /etc/urpm/hooks.d/ : it masks this one entirely, and it survives
# upgrades because nothing here is %config.

# A package that wants its own service restarted after the operation
# says so in its spec:
#
#     Provides: restart-on-completion = its-service
#
# This one rule covers every package that declares it, and without a
# rule the capability does nothing on its own.  It reports rather than
# acts, like needrestart: restarting sshd or a display manager
# underneath a live session is how machines break, so the operator is
# the one who decides when.
#
# An administrator who wants urpm to do it can copy this file to
# /etc/urpm/hooks.d/50-declared-restarts.cfg and set:
#
#     action = restart-service
#
# The restart is then a try-restart: a service that was not running is
# never started.
[on-completion:declared-restarts]
watch  = restart-on-completion
action = report
