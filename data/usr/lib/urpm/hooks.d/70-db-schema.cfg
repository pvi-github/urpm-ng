# Post-operation rules shipped by urpm-ng.
#
# Read once an operation is committed and recorded, never during it.
# See urpm/core/hooks.py and doc/SPEC_POST_TRANSACTION_HOOKS.md.
#
# To change any of this, drop a file of the SAME NAME in
# /etc/urpm/hooks.d/ : it masks this one entirely, and it survives
# upgrades because nothing here is %config.

# urpm-ng-core declares the schema its code expects:
#
#     Provides: urpm-db-schema = <n>
#
# When an operation installs it, the database on disk is still on the
# previous schema, and the process that just installed it cannot move
# it: its own modules were imported before rpm replaced them, so its
# idea of the expected version is the old one, and it holds that same
# database open for the whole operation.
#
# Hence `after-exit`, the one moment where neither is true any more:
# the action is carried out by a fresh interpreter once this urpm has
# gone.  See §5.1 of the spec.
#
# Nothing is lost if it does not happen: the first privileged urpm
# command migrates the schema as it always did, and a read-only
# command on an old schema says so instead of failing.
[after-exit:db-schema]
watch  = urpm-db-schema
action = migrate-db
