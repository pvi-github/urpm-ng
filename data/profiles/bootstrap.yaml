# mkimage profile: bootstrap
# Package set for a minimal bootable Mageia chroot (mkimage phase 1).
#
# Install order is enforced by _phase1_bootstrap_chroot, not by this list:
#   1. ``filesystem``            alone, WITH scriptlets — its Lua %pretrans
#      lays down the FHS + UsrMove symlinks (/bin -> usr/bin, ...) before
#      any other package extracts files under those paths.
#   2. ``makedev``               alone, with --noscripts — its shell
#      %posttrans needs a populated chroot; skipped here.
#   3. ``setup``                 with scriptlets — /etc/passwd/group/shadow
#      via %files.
#   4. ``basesystem-minimal-core`` with scriptlets — the solver pulls in
#      glibc, bash, coreutils, shadow-utils, rpm, mageia-release, ... The
#      ``basesystem-minimal`` meta would also drag in cron, logrotate,
#      initscripts, kbd, kmod, iproute2, binutils (via file), ... that
#      have no purpose in a container image (~57 MB saved).  Missing
#      utilities (less, timezone, iproute2) can be installed on demand
#      via urpm once the container is running.
#   5. Any remaining names below with scriptlets — mostly already pulled
#      transitively, listed explicitly for reproducibility.
#
# The resulting chroot must be bootable, have network access, and allow a
# full urpm install (scriptlets active) to run cleanly in phase 2
# (container promote).

description: Minimal bootable Mageia chroot for mkimage phase 1

packages:
  - filesystem
  - makedev
  - setup
  - basesystem-minimal-core
  - glibc
  - bash
  - coreutils
  - findutils
  - grep
  - sed
  - gawk
  - util-linux
  - shadow-utils
  - rpm
  - urpmi
  # urpm-ng is installed separately by Phase 1 (local RPM fallback until
  # it lands in official Mageia repos)
  - rootcerts
  - curl
  # openssl on mga9 doesn't declare Requires: crypto-policies, so the
  # /etc/crypto-policies/back-ends/opensslcnf.config file it references
  # isn't there and every openssl invocation aborts at startup with
  # "FATAL: Startup failure ... calling stat(.../opensslcnf.config)".
  # mga10 doesn't have the bug because something upstream of us tugs
  # crypto-policies in (probably a fixed openssl.spec).  Pull both
  # packages explicitly so the image is robust across mga versions
  # regardless of the upstream Requires hygiene.
  - crypto-policies
  - crypto-policies-scripts
